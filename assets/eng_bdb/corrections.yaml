# Corrections to Sefaria's BDB, applied by tools/import-sefaria-bdb.py and
# marked in the TEI file. The one-letter Hebrew slips are generated into
# corrections-letters.yaml; these are the rest, each checked in the 1906
# print (Internet Archive hebrewenglishlex00browuoft; printed page p is
# image n{p+23}) by the maintainer on 2026-11-21, as recorded in
# print-checks.md.
#
# Kinds:
#   ref: a scripture reference whose printed text Sefaria got wrong; `link`
#        is Sefaria's data-ref, `sic` the reference as Sefaria shows it,
#        `corr` as the print has it (in Sefaria's style of writing references).
#   meant: a reference BDB itself misprinted. The text stays as printed; the
#        TEI gives the verse meant (bn:meant), which the app links to.
#   homograph: a homograph number (I., II.) Sefaria got wrong.
#   note: a reading kept as printed, with a note in the TEI file only.

