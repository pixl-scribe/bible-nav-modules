# replace:  the entry's content after its headword, in Perseus's own
#           markup, as the converter reads everything else
# evidence: the printed page, and what it shows
#
# The entry's change note in the TEI file quotes both.
#
# Xerxes: Perseus writes capital xi as *c (15 times, *ce/rcew among them),
# but three times as *j, which is no Beta Code letter.

