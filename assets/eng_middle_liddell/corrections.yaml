# The letter article for sigma: Perseus lost the lunate sigma, wrote final
# sigma and double sigma as plain s and ss, garbled stigma and sampi, left
# out sense II.2, and misnumbered 10 and 11 ("II"). Letter shapes are given
# as characters (escaped); stigma and sampi as Beta Code numerals.

- entry: n29501
  source: "<form opt=\"n\"><orth extent=\"full\" lang=\"greek\" opt=\"n\">si=gma</orth></form> <sense level=\"0\" n=\"0\" id=\"n29501.0\" opt=\"n\"><foreign lang=\"greek\">*s, s, si=gma</foreign>, <foreign lang=\"greek\">to/</foreign>, indecl., a semi-vowel, eighteenth letter of the Gr. Alph.: as numeral <foreign lang=\"greek\">s\u02B9</foreign> = 200, but <foreign lang=\"greek\">\u0375s</foreign> = 200,000.</sense> <sense level=\"2\" n=\"I\" id=\"n29501.1\" opt=\"n\">beside the form <foreign lang=\"greek\">*s</foreign>, it was written as a semicircle . In the written character, final <foreign lang=\"greek\">s</foreign> became <foreign lang=\"greek\">s</foreign>: from which must be distinguished the character <foreign lang=\"greek\">s41</foreign> = 6. There was also a Doric name <foreign lang=\"greek\">sa/n [a^]</foreign> (cf. <foreign lang=\"greek\">sam-fo/ras</foreign>), which appeared at the end of the alphabet as <foreign lang=\"greek\">sampi/</foreign> or <foreign lang=\"greek\">sampi=, \\\\y\\\\,</foreign> = 900.</sense> <sense level=\"2\" n=\"II\" id=\"n29501.2\" opt=\"n\">dialectic and other changes:</sense> <sense level=\"3\" n=\"1\" id=\"n29501.3\" opt=\"n\">aeolic and ionic into <foreign lang=\"greek\">d</foreign>, as <foreign lang=\"greek\">o)dmh/ i)/dmen</foreign> for <foreign lang=\"greek\">o)smh/ i)/smen.</foreign> </sense> <sense level=\"3\" n=\"3\" id=\"n29501.4\" opt=\"n\">in aeolic and doric, and in Poets, <foreign lang=\"greek\">s</foreign> was often doubled, as <foreign lang=\"greek\">o(/ssos me/ssos o)pi/ssw</foreign> for <foreign lang=\"greek\">o(/sos me/sos o)pi/sw</foreign>, and in fut. and aor. 1 forms, as <foreign lang=\"greek\">dama/ssw o)le/ssw</foreign>, etc. for <foreign lang=\"greek\">dama/sw o)le/sw</foreign>, etc.</sense> <sense level=\"3\" n=\"4\" id=\"n29501.5\" opt=\"n\"><foreign lang=\"greek\">s</foreign> sometimes passed into <foreign lang=\"greek\">pt</foreign> or vice versa, as <foreign lang=\"greek\">pe/ssw</foreign> and <foreign lang=\"greek\">pe/ptw, o)/yomai</foreign> (*<foreign lang=\"greek\">o)/ptw</foreign>) and <foreign lang=\"greek\">o)/ssomai, e)ni/ssw</foreign> and <foreign lang=\"greek\">e)ni/ptw.</foreign> </sense> <sense level=\"3\" n=\"5\" id=\"n29501.6\" opt=\"n\">doric into <foreign lang=\"greek\">c</foreign>, in fut. and aor1 of Verbs, with their deriv. Nouns, as <foreign lang=\"greek\">e)rga/comai xei/ricis</foreign> for <foreign lang=\"greek\">e)rga/somai xei/risis</foreign>:\u2014so in ionic, <foreign lang=\"greek\">dico/s trico/s</foreign> for <foreign lang=\"greek\">disso/s trisso/s</foreign>; and in old attic, the prep. <foreign lang=\"greek\">su/n</foreign>, with all its Compds., was written <foreign lang=\"greek\">cu/n.</foreign> </sense> <sense level=\"3\" n=\"6\" id=\"n29501.7\" opt=\"n\">attic <foreign lang=\"greek\">s</foreign> and <foreign lang=\"greek\">ss</foreign> sometimes passed into <foreign lang=\"greek\">y</foreign>, cf. <foreign lang=\"greek\">*y y</foreign> III.</sense> <sense level=\"3\" n=\"7\" id=\"n29501.8\" opt=\"n\">in aeolic, as in Lat., <foreign lang=\"greek\">s</foreign> represents the aspirate, <foreign lang=\"greek\">*salmudhsso/s *(almudhsso/s, su=s</foreign> (Lat. <foreign lang=\"la\">sus</foreign>) <foreign lang=\"greek\">u(=s, a(/ls</foreign> <trans opt=\"n\"><tr opt=\"n\">sal</tr></trans>, <foreign lang=\"greek\">e(/c</foreign> <trans opt=\"n\"><tr opt=\"n\">sex</tr></trans>, <foreign lang=\"greek\">e(pta/</foreign> <trans opt=\"n\"><tr opt=\"n\">septem</tr></trans>, <foreign lang=\"greek\">e(/rpw</foreign> <trans opt=\"n\"><tr opt=\"n\">serpo</tr></trans>, <foreign lang=\"greek\">u(/lh</foreign> <trans opt=\"n\"><tr opt=\"n\">sylva.</tr></trans> </sense> <sense level=\"3\" n=\"8\" id=\"n29501.9\" opt=\"n\">prefixed to words beginning with <foreign lang=\"greek\">m</foreign> and <foreign lang=\"greek\">t, mu/raina smu/raina, mikro/s smikro/s, te/gos ste/gw</foreign>, Lat. <foreign lang=\"la\">tego</foreign>; more rarely before <foreign lang=\"greek\">k</foreign> and <foreign lang=\"greek\">f, ski/dnamai ki/dnamai, sfa/llw</foreign> <trans opt=\"n\"><tr opt=\"n\">fallo</tr></trans>, <foreign lang=\"greek\">sfendo/nh</foreign> <trans opt=\"n\"><tr opt=\"n\">funda.</tr></trans> </sense> <sense level=\"3\" n=\"9\" id=\"n29501.10\" opt=\"n\"><foreign lang=\"greek\">s</foreign> was inserted in the middle of words before <foreign lang=\"greek\">q</foreign>, esp. by Poets in the 1 pers. pl. pass. and mid., as <foreign lang=\"greek\">tupto/mesqa</foreign> for <foreign lang=\"greek\">tupto/meqa</foreign>; so <foreign lang=\"greek\">o)/pisqen</foreign> for <foreign lang=\"greek\">o)/piqen.</foreign> </sense> <sense level=\"0\" n=\"10\" id=\"n29501.11\" opt=\"n\">conversely, the Lacon. used to throw out <foreign lang=\"greek\">s</foreign> between two vowels, writing <foreign lang=\"greek\">*mw=a</foreign> for <foreign lang=\"greek\">*mou=sa.</foreign> </sense> <sense level=\"2\" n=\"II\" id=\"n29501.12\" opt=\"n\"><foreign lang=\"greek\">s</foreign> changed into <foreign lang=\"greek\">r</foreign>, doric and attic, when another <foreign lang=\"greek\">r</foreign> goes before, as <foreign lang=\"greek\">a)/rrhn</foreign> for <foreign lang=\"greek\">a)/rshn, qa/rros</foreign> for <foreign lang=\"greek\">qa/rsos.</foreign> </sense> <sense level=\"3\" n=\"12\" id=\"n29501.13\" opt=\"n\">Lacon., <foreign lang=\"greek\">s</foreign> is substituted for <foreign lang=\"greek\">q</foreign>, as <foreign lang=\"greek\">sio/s *)asa/na parse/nos</foreign> for <foreign lang=\"greek\">qeo/s *)aqh/nh parqe/nos.</foreign> </sense> <sense level=\"3\" n=\"13\" id=\"n29501.14\" opt=\"n\">doric, <foreign lang=\"greek\">sd</foreign> for <foreign lang=\"greek\">z</foreign>, as <foreign lang=\"greek\">masdo/s tra/pesda</foreign> for <foreign lang=\"greek\">mazo/s tra/peza.</foreign> </sense> <sense level=\"3\" n=\"14\" id=\"n29501.15\" opt=\"n\"><foreign lang=\"greek\">s</foreign> is appended to <foreign lang=\"greek\">ou(/tw a)/xri me/xri</foreign> before a vowel.</sense>"
  replace: "<sense level=\"0\" n=\"0\" id=\"n29501.0\" opt=\"n\"><foreign lang=\"greek\">*s, s, si=gma</foreign>, <foreign lang=\"greek\">to/</foreign>, indecl., a semi-vowel, eighteenth letter of the Gr. Alph.: as numeral <foreign lang=\"greek\">s\u02B9</foreign> = 200, but <foreign lang=\"greek\">\u0375s</foreign> = 200,000.</sense> <sense level=\"2\" n=\"I\" id=\"n29501.1\" opt=\"n\">beside the form <foreign lang=\"greek\">*s</foreign>, it was written as a semicircle \u03F9. In the written character, final <foreign lang=\"greek\">s</foreign> became \u03C2: from which must be distinguished the character <foreign lang=\"greek\">#2#</foreign> = 6. There was also a Doric name <foreign lang=\"greek\">sa/n [a^]</foreign> (cf. <foreign lang=\"greek\">sam-fo/ras</foreign>), which appeared at the end of the alphabet as <foreign lang=\"greek\">sampi/</foreign> or <foreign lang=\"greek\">sampi=, #5,</foreign> = 900.</sense> <sense level=\"2\" n=\"II\" id=\"n29501.2\" opt=\"n\">dialectic and other changes:</sense> <sense level=\"3\" n=\"1\" id=\"n29501.3\" opt=\"n\">aeolic and ionic into <foreign lang=\"greek\">d</foreign>, as <foreign lang=\"greek\">o)dmh/ i)/dmen</foreign> for <foreign lang=\"greek\">o)smh/ i)/smen.</foreign> </sense> <sense level=\"3\" n=\"2\">aeolic and doric into <foreign lang=\"greek\">t</foreign>, <foreign lang=\"greek\">tu/ i)/ttw *poti/dan poti/ fati/</foreign> for <foreign lang=\"greek\">su/ i)/stw *poseidw=n pro/s fhsi/</foreign>:\u2014so in later attic, as <foreign lang=\"greek\">me/taulos th/meron</foreign> for <foreign lang=\"greek\">me/saulos sh/meron</foreign>:\u2014in later attic, also \u03C3\u03C3 passed into <foreign lang=\"greek\">tt</foreign>, <foreign lang=\"greek\">pra/ttw ta/ttw</foreign> for <foreign lang=\"greek\">pra/ssw ta/ssw</foreign>, <foreign lang=\"greek\">qa/latta h(/ttwn</foreign> for <foreign lang=\"greek\">qa/lassa h(/sswn</foreign>.</sense> <sense level=\"3\" n=\"3\" id=\"n29501.4\" opt=\"n\">in aeolic and doric, and in Poets, <foreign lang=\"greek\">s</foreign> was often doubled, as <foreign lang=\"greek\">o(/ssos me/ssos o)pi/ssw</foreign> for <foreign lang=\"greek\">o(/sos me/sos o)pi/sw</foreign>, and in fut. and aor. 1 forms, as <foreign lang=\"greek\">dama/ssw o)le/ssw</foreign>, etc. for <foreign lang=\"greek\">dama/sw o)le/sw</foreign>, etc.</sense> <sense level=\"3\" n=\"4\" id=\"n29501.5\" opt=\"n\"><foreign lang=\"greek\">s</foreign> sometimes passed into <foreign lang=\"greek\">pt</foreign> or vice versa, as <foreign lang=\"greek\">pe/ssw</foreign> and <foreign lang=\"greek\">pe/ptw, o)/yomai</foreign> (*<foreign lang=\"greek\">o)/ptw</foreign>) and <foreign lang=\"greek\">o)/ssomai, e)ni/ssw</foreign> and <foreign lang=\"greek\">e)ni/ptw.</foreign> </sense> <sense level=\"3\" n=\"5\" id=\"n29501.6\" opt=\"n\">doric into <foreign lang=\"greek\">c</foreign>, in fut. and aor1 of Verbs, with their deriv. Nouns, as <foreign lang=\"greek\">e)rga/comai xei/ricis</foreign> for <foreign lang=\"greek\">e)rga/somai xei/risis</foreign>:\u2014so in ionic, <foreign lang=\"greek\">dico/s trico/s</foreign> for <foreign lang=\"greek\">disso/s trisso/s</foreign>; and in old attic, the prep. <foreign lang=\"greek\">su/n</foreign>, with all its Compds., was written <foreign lang=\"greek\">cu/n.</foreign> </sense> <sense level=\"3\" n=\"6\" id=\"n29501.7\" opt=\"n\">attic <foreign lang=\"greek\">s</foreign> and \u03C3\u03C3 sometimes passed into <foreign lang=\"greek\">y</foreign>, cf. <foreign lang=\"greek\">*y y</foreign> III.</sense> <sense level=\"3\" n=\"7\" id=\"n29501.8\" opt=\"n\">in aeolic, as in Lat., <foreign lang=\"greek\">s</foreign> represents the aspirate, <foreign lang=\"greek\">*salmudhsso/s *(almudhsso/s, su=s</foreign> (Lat. <foreign lang=\"la\">sus</foreign>) <foreign lang=\"greek\">u(=s, a(/ls</foreign> <trans opt=\"n\"><tr opt=\"n\">sal</tr></trans>, <foreign lang=\"greek\">e(/c</foreign> <trans opt=\"n\"><tr opt=\"n\">sex</tr></trans>, <foreign lang=\"greek\">e(pta/</foreign> <trans opt=\"n\"><tr opt=\"n\">septem</tr></trans>, <foreign lang=\"greek\">e(/rpw</foreign> <trans opt=\"n\"><tr opt=\"n\">serpo</tr></trans>, <foreign lang=\"greek\">u(/lh</foreign> <trans opt=\"n\"><tr opt=\"n\">sylva.</tr></trans> </sense> <sense level=\"3\" n=\"8\" id=\"n29501.9\" opt=\"n\">prefixed to words beginning with <foreign lang=\"greek\">m</foreign> and <foreign lang=\"greek\">t, mu/raina smu/raina, mikro/s smikro/s, te/gos ste/gw</foreign>, Lat. <foreign lang=\"la\">tego</foreign>; more rarely before <foreign lang=\"greek\">k</foreign> and <foreign lang=\"greek\">f, ski/dnamai ki/dnamai, sfa/llw</foreign> <trans opt=\"n\"><tr opt=\"n\">fallo</tr></trans>, <foreign lang=\"greek\">sfendo/nh</foreign> <trans opt=\"n\"><tr opt=\"n\">funda.</tr></trans> </sense> <sense level=\"3\" n=\"9\" id=\"n29501.10\" opt=\"n\"><foreign lang=\"greek\">s</foreign> was inserted in the middle of words before <foreign lang=\"greek\">q</foreign>, esp. by Poets in the 1 pers. pl. pass. and mid., as <foreign lang=\"greek\">tupto/mesqa</foreign> for <foreign lang=\"greek\">tupto/meqa</foreign>; so <foreign lang=\"greek\">o)/pisqen</foreign> for <foreign lang=\"greek\">o)/piqen.</foreign> </sense> <sense level=\"3\" n=\"10\" id=\"n29501.11\" opt=\"n\">conversely, the Lacon. used to throw out <foreign lang=\"greek\">s</foreign> between two vowels, writing <foreign lang=\"greek\">*mw=a</foreign> for <foreign lang=\"greek\">*mou=sa.</foreign> </sense> <sense level=\"3\" n=\"11\" id=\"n29501.12\" opt=\"n\"><foreign lang=\"greek\">s</foreign> changed into <foreign lang=\"greek\">r</foreign>, doric and attic, when another <foreign lang=\"greek\">r</foreign> goes before, as <foreign lang=\"greek\">a)/rrhn</foreign> for <foreign lang=\"greek\">a)/rshn, qa/rros</foreign> for <foreign lang=\"greek\">qa/rsos.</foreign> </sense> <sense level=\"3\" n=\"12\" id=\"n29501.13\" opt=\"n\">Lacon., <foreign lang=\"greek\">s</foreign> is substituted for <foreign lang=\"greek\">q</foreign>, as <foreign lang=\"greek\">sio/s *)asa/na parse/nos</foreign> for <foreign lang=\"greek\">qeo/s *)aqh/nh parqe/nos.</foreign> </sense> <sense level=\"3\" n=\"13\" id=\"n29501.14\" opt=\"n\">doric, <foreign lang=\"greek\">sd</foreign> for <foreign lang=\"greek\">z</foreign>, as <foreign lang=\"greek\">masdo/s tra/pesda</foreign> for <foreign lang=\"greek\">mazo/s tra/peza.</foreign> </sense> <sense level=\"3\" n=\"14\" id=\"n29501.15\" opt=\"n\">\u03C2 is appended to <foreign lang=\"greek\">ou(/tw a)/xri me/xri</foreign> before a vowel.</sense>"
  evidence: "1889 printing (Internet Archive intermediategree00lidd), page 720 (viewer page 725 of 919), the letter article \"S, s, sigma\": \"it was written as a semicircle [lunate sigma]. In the written character, final sigma became [final sigma]: from which must be distinguished the character [stigma]' = 6 ... as sampi or sampi, [sampi], = 900\"; II. 2 \"Aeol. and Dor. into t, ty itto Potidan poti phati for sy isto Poseidon pros phesi:\u2014so in later Att., as metaulos temeron for mesaulos semeron:\u2014in later Att., also ss passed into tt, pratto tatto for prasso tasso, thalatta hetton for thalassa hesson\"; 6 \"sigma and double sigma\"; 10 and 11 numbered under II; 14 \"[final sigma] is appended\"; checked by the maintainer on 2026-11-19 from screenshots of the page."

