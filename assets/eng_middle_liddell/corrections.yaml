# by tools/import-middle-liddell.py, each checked against the 1889 printing
# (Internet Archive, intermediategree00lidd; printed page = image - 5).
#
# entry:    the Perseus id, such as n2013
# source:   the whole Greek text of one element, in Beta Code, exactly as
#           the source has it (the converter matches it exactly)
# corr:     what it should be, in Beta Code
# evidence: the printed page, and what it shows
#
# The 65 words Perseus's conversion tool split in two ("failing on lembuf
# []") are joined by a rule in the converter, not listed here.
#
# Where Perseus lost text, a whole entry is rewritten from the print:
